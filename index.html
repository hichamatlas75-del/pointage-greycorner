<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Grey Corner - Application de pointage et gestion des présences" />
  <title>Grey Corner • Pointage & Présences</title>

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts : Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Styles personnalisés -->
  <link rel="stylesheet" href="app.css" />
</head>

<body class="flex items-center justify-center p-4">
  <div class="card">
    <div class="content">

      <!-- Indicateur hors-ligne -->
      <div id="offlineBar" class="offline-bar">
        ⚠️ Mode hors-ligne détecté — Connexion Internet requise
      </div>

      <!-- Logo de la marque -->
      <div class="logo-wrap flex-shrink-0">
        <img id="logo" src="images/LOGO GREY CORNER.png" class="logo-img" alt="Grey Corner" title="Grey Corner" />
      </div>

      <!-- Barre de session connectée -->
      <div id="sessionBar" class="hidden session-bar mt-2">
        <div class="session-pill">
          <span class="session-dot"></span>
          <span class="muted" style="font-size:10px">Connecté :</span>
          <span id="roleLabel" class="gold" style="font-size:11px;font-weight:900">—</span>
        </div>
        <button id="btnLogout" type="button" class="btn-logout">Déconnexion</button>
      </div>

      <!-- Écran d'accueil public / Connexion -->
      <div id="publicHome" class="public-stack">
        <button type="button"
          onclick="window.open('https://grey-corner-app.pages.dev/', '_blank', 'noopener,noreferrer')"
          class="btn-base btn-planning">
          🗓️ Consulter le Planning
        </button>

        <a href="https://greycorner.pages.dev/" target="_blank" rel="noopener noreferrer"
          class="btn-base btn-menu" style="text-decoration:none">
          🌙 Menu
        </a>

        <button id="btnShowLogin" type="button" class="btn-base btn-connexion">
          🔐 Connexion
        </button>

        <div id="homeMsg" class="hidden home-box">
          <div class="label-caps mb-2">Note de service</div>
          <div id="homeMsgContent" style="font-size:12px;font-weight:600;line-height:1.5">Chargement…</div>
        </div>

        <div id="loginWrap" class="hidden login-wrap">
          <div class="label-caps mb-3">Connexion Équipe</div>
          <div class="space-y-2">
            <input id="loginEmail" class="inpt" type="email" placeholder="Email" autocomplete="username" />
            <input id="loginPass" class="inpt" type="password" placeholder="Mot de passe" autocomplete="current-password" />
            <div id="pinBlock" class="hidden">
              <input id="loginPin" class="inpt" type="password" maxlength="4"
                placeholder="Créer votre PIN (4 chiffres)" inputmode="numeric" style="margin-top:8px"/>
              <div class="hint mt-2">Le PIN sert uniquement à réinitialiser cet appareil.</div>
            </div>
            <button id="btnLogin" type="button" class="btn-login" style="margin-top:4px">Se connecter</button>
            <div id="loginMsg" style="font-size:10px;font-weight:700;color:var(--red)"></div>
          </div>
        </div>
      </div>

      <!-- Bannière d'annonces urgentes -->
      <div id="banner-wrap" class="banner-wrap">
        <div id="banner" class="banner"></div>
      </div>

      <div class="sep"></div>

      <!-- Application de Pointage & Gestion -->
      <div id="app-pointage" class="flex flex-col flex-grow overflow-y-auto hidden">

        <!-- 1. Sélection de l'employé -->
        <div id="selection" class="scroll flex-grow"></div>

        <!-- 2. Bouton Planning interne -->
        <div id="planningPanel" class="mt-3 mb-2">
          <button type="button"
            onclick="window.open('https://grey-corner-app.pages.dev/', '_blank', 'noopener,noreferrer')"
            class="btn-planning-inner">
            🗓️ Consulter le Planning
          </button>
        </div>

        <!-- 3. Zone d'action de l'employé assigné -->
        <div id="action" class="hidden flex flex-col flex-grow overflow-y-auto scroll" style="padding-bottom:16px">
          
          <!-- Carte Profil Collaborateur Design 2 -->
          <div class="profile-card">
            <div class="avatar-ring" id="avatarContainer">
              <div class="avatar-inner" id="avatarMonogram">GC</div>
            </div>
            <div class="flex flex-col justify-center min-w-0 flex-1">
              <div class="label-caps" style="color:var(--cyan-neon);font-size:8.5px">Collaborateur Assigné</div>
              <div id="username" class="username-display truncate">--</div>
              <div id="userRoleBadge" class="poste-badge mt-1" style="width:fit-content;font-size:8.5px;padding:2px 8px">Service</div>
            </div>
          </div>

          <div id="pointage-zone" class="text-center space-y-4">
            <div style="display:flex;justify-content:center">
              <div class="gps-pill" id="gpsPill">
                <span class="gps-dot searching" id="gpsDot"></span>
                <span id="status">Localisation GPS…</span>
              </div>
            </div>
            <div class="btn-main-wrap" id="btnMainWrap">
              <button id="btn" type="button" class="btn-main" disabled>
                Appuyer pour valider
              </button>
            </div>
            <button id="btnRetryGPS" type="button" class="btn-gps-retry">
              📍 Réessayer GPS
            </button>
          </div>

          <!-- 4. HISTORIQUE DU MOIS & 7 JOURS -->
          <div class="histo-wrap" id="histoWrap" style="display:none">
            <div class="histo-header">
              <div class="flex items-center gap-1">
                <button id="btnHistoPrev" type="button" class="histo-nav-btn" aria-label="Mois précédent">◀</button>
                <span id="histoMonthLabel" class="histo-month-title">--</span>
                <button id="btnHistoNext" type="button" class="histo-nav-btn" aria-label="Mois suivant">▶</button>
              </div>
              <div class="flex items-center gap-2">
                <div class="histo-toggle">
                  <button id="btnTab7d" type="button" class="histo-tab-btn">7j</button>
                  <button id="btnTabMonth" type="button" class="histo-tab-btn active">Mois</button>
                </div>
                <div id="histoLoading" class="label-caps" style="color:rgba(0,240,255,.5);font-size:8px">…</div>
              </div>
            </div>

            <!-- Indicateurs clés du mois (KPIs) -->
            <div id="histoKpis" class="histo-kpis">
              <div class="histo-kpi-item kpi-present">
                <span class="histo-kpi-num" id="kpiPresentCount" style="color:var(--emerald-neon)">0</span>
                <span class="histo-kpi-lbl">Présents</span>
              </div>
              <div class="histo-kpi-item kpi-late">
                <span class="histo-kpi-num" id="kpiLateCount" style="color:var(--coral-electric)">0</span>
                <span class="histo-kpi-lbl">Retards</span>
              </div>
              <div class="histo-kpi-item kpi-cumul">
                <span class="histo-kpi-num" id="kpiTotalLateMin" style="color:var(--amber-electric)">0m</span>
                <span class="histo-kpi-lbl">Cumul</span>
              </div>
              <div class="histo-kpi-item kpi-off">
                <span class="histo-kpi-num" id="kpiOffCount" style="color:var(--indigo-soft)">0</span>
                <span class="histo-kpi-lbl">Repos</span>
              </div>
            </div>

            <div id="histoList" class="histo-list-scroll"></div>
          </div>

          <div class="text-center mt-6">
            <button id="btnResetDevice" type="button" class="btn-reset-device">
              Réinitialiser l'appareil (PIN)
            </button>
          </div>
        </div>

        <!-- 5. Panneau de Supervision Gérant -->
        <div id="adminWrap" class="admin-wrap">
          <div class="flex items-center justify-between gap-3">
            <div class="label-caps gold">Supervision gérant</div>
            <button id="btnCloseAdmin" type="button" class="btn-logout">Fermer</button>
          </div>
          <div class="admin-list" id="adminList"></div>
          <button id="btnResetAll" type="button" class="btn-reset-all">🔄 Reset global (tous les mobiles)</button>
        </div>

      </div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Moteur applicatif JavaScript -->
  <script src="app.js"></script>
</body>
</html>
